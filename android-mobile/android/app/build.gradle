plugins { id 'com.android.application' }
android {
    namespace 'dev.modmind.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.modmind'
        minSdk 29
        targetSdk 35
        versionCode 8
        versionName '1.0.0-preview.1'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildFeatures { buildConfig true }
    // Keep the existing local preview certificate so the phone's test installation can upgrade.
    // Release APKs disable WebView inspection and Android debugging; store distribution is separate.
    buildTypes { release { signingConfig signingConfigs.debug; debuggable false; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += ['**/*.so'] } }
}
dependencies { implementation 'androidx.webkit:webkit:1.13.0' }
